name: Yojana Setu - CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast, Cached Backend CI (Python FastAPI + Pytest)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx email-validator python-multipart

      - name: Run Backend Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-cd-pipeline-test-secret-key-min-32-chars"
        run: |
          cd backend
          python -m pytest -v --tb=short

  # ---------------------------------------------------------------------------
  # 2. Fast, Cached Frontend CI (Next.js & TypeScript)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Next.js & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Production Build Check
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Deployment Summary
  # ---------------------------------------------------------------------------
  deployment-status:
    name: Deployment Readiness
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Report CI Completion
        run: |
          echo "======================================================="
          echo " CI/CD Pipeline Passed Successfully!                   "
          echo " Ready for Automatic Deployments on Render & Vercel.   "
          echo "======================================================="
